stages:
  - test
  - build
  - push
  - cleanup
  - deploy

variables:
  DOCKER_REGISTRY: registry.gitlab.com/biyartech1/fan-fam-apps/fanfam-frontend-react:$CI_COMMIT_REF_NAME
  DOCKER_REGISTRY_SERVER: registry.gitlab.com
  DOCKER_FILE: docker/Dockerfile
  COMPOSE_FILE: docker/compose.yml
  CONTAINER_NAME: fanfam-web

test:
  stage: test
  tags:
    - fanfam
  script:
    - echo "Running test"
    - echo "Test passed"

build:
  stage: build
  tags:
    - fanfam
  script:
    - |
      echo "Running Build..."

      echo "--- ENV_FILE path ---"
      echo "$ENV_FILE"

      echo "--- Does ENV_FILE path exist? ---"
      ls -la "$ENV_FILE" 2>/dev/null || echo "PATH DOES NOT EXIST"

      echo "--- ENV_FILE contents (key names only) ---"
      grep -o '^[^=]*' "$ENV_FILE" 2>/dev/null || echo "COULD NOT READ FILE"

      cp "$ENV_FILE" .env

      DOCKER_BUILDKIT=1 docker build \
        --secret id=envfile,src=.env \
        -t $DOCKER_REGISTRY \
        -f $DOCKER_FILE .

      rm -f .env
      echo "Build OK"

push:
  stage: push
  tags:
    - fanfam
  script:
    - |
      docker info
      echo "$CI_REGISTRY_PASSWORD" | docker login -u "$CI_REGISTRY_USER" --password-stdin "$CI_REGISTRY"
      docker image push $DOCKER_REGISTRY
      echo "push completed"

cleanup:
  stage: cleanup
  tags:
    - fanfam
  script:
    - |
      cp "$ENV_FILE" .env
      docker compose -f $COMPOSE_FILE down
      docker image prune -f
      echo "cleanup done"

deploy:
  stage: deploy
  tags:
    - fanfam
  script:
    - |
      cp "$ENV_FILE" .env
      docker compose -f $COMPOSE_FILE up -d
      echo "deploy completed"
